name: Release

# Every push checks that each asset still has its metadata, thumbnail and preview. A v* tag
# publishes index.json + drift-assets.tar.gz as a GitHub release, which the CutWire marketplace
# syncs from (its admin names the tag to serve).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build index
        run: python3 tools/build-index.py dist "${GITHUB_REF_NAME}"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/index.json dist/drift-assets.tar.gz \
            --title "Drift Assets $GITHUB_REF_NAME" --notes "Asset pack $GITHUB_REF_NAME."
